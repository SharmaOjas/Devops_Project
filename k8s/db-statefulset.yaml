# Database credentials. Ingest/analyst passwords must match the roles created in database.sql (part 3).
apiVersion: v1
kind: Secret
metadata:
  name: dsw-db-secret
type: Opaque
stringData:
  DSW_DB_PASSWORD: dsw_owner_pw          # postgres superuser
  DSW_INGEST_PASSWORD: dsw_ingest_pw
  DSW_ANALYST_PASSWORD: dsw_analyst_pw
---
# PostGIS as a StatefulSet: stable identity + its own PersistentVolumeClaim, so AIS history and
# spatial tables survive pod restarts and rescheduling.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
spec:
  serviceName: postgis
  replicas: 1
  selector:
    matchLabels: { app: postgis }
  template:
    metadata:
      labels: { app: postgis }
    spec:
      containers:
        - name: postgis
          image: postgis/postgis:15-3.3
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: darkshipwatch
            - name: PGDATA                      # subfolder: the volume root may contain lost+found
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: dsw-db-secret, key: DSW_DB_PASSWORD }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "darkshipwatch"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
